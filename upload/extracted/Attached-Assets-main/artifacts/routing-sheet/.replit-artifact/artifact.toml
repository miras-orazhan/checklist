kind = "web"
previewPath = "/"
title = "Цифровой обходной лист"
version = "1.0.0"
id = "artifacts/routing-sheet"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22933

[services.development]
run = "pnpm --filter @workspace/routing-sheet run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/routing-sheet", "run", "build" ]
serve = "static"
publicDir = "artifacts/routing-sheet/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22933"
BASE_PATH = "/"
